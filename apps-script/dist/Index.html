<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">

<style>
  /* Theme colours – changed live by the 🎨 Theme panel */
  :root { --p: #0f766e; --p-soft: #ccfbf1; --hdr: #134e4a; --hdr-text: #ffffff; --th: #0f766e; --th-text: #ffffff; --bg: #f1f5f9; --stripe: #f8fafc; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); }
  html[dir=rtl] body { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.1; }
  .num { direction: ltr; unicode-bidi: embed; font-family: 'Inter', sans-serif; }
  .card { background: #fff; border-radius: .6rem; box-shadow: 0 1px 3px rgba(15,23,42,.08); border: 1px solid #e2e8f0; padding: 1rem; }
  .card h2 { color: var(--p); }
  .inp { border: 1px solid #cbd5e1; border-radius: .375rem; padding: .3rem .6rem; background: #fff; }
  .inp:focus { outline: 2px solid var(--p); outline-offset: 0; border-color: var(--p); }
  .btn { border-radius: .375rem; padding: .4rem 1rem; color: #fff; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .btn:hover { filter: brightness(1.08); }
  .bg-p { background: var(--p); } .text-p { color: var(--p); } .hover\:text-p:hover { color: var(--p); }
  a.link { color: var(--p); cursor: pointer; font-weight: 500; } a.link:hover { text-decoration: underline; }

  /* Header + tabs */
  .topbar { background: var(--hdr); color: var(--hdr-text); }
  .topbar .inp { background: rgba(255,255,255,.12); color: var(--hdr-text); border-color: rgba(255,255,255,.3); }
  .topbar .inp option { color: #0f172a; }
  .tabbar { background: #fff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .tab { display: inline-flex; align-items: center; gap: .45rem; padding: .7rem 1rem; color: #475569; border-bottom: 3px solid transparent; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--p); background: var(--stripe); }
  .tab.active { color: var(--p); border-bottom-color: var(--p); background: var(--p-soft); }
  .tab svg { width: 1.1rem; height: 1.1rem; }
  .badge-n { background: #dc2626; color: #fff; border-radius: 9999px; font-size: .7rem; padding: 0 .4rem; }

  /* Tables: real grid */
  table.t { width: 100%; font-size: .875rem; border-collapse: separate; border-spacing: 0; border: 1px solid #cbd5e1; border-radius: .5rem; overflow: hidden; }
  table.t th { text-align: start; background: var(--th); color: var(--th-text); font-weight: 600; padding: .55rem .7rem; border-inline-end: 1px solid rgba(255,255,255,.25); white-space: nowrap; }
  table.t td { padding: .5rem .7rem; border-top: 1px solid #e2e8f0; border-inline-end: 1px solid #e2e8f0; vertical-align: top; background: #fff; }
  table.t th:last-child, table.t td:last-child { border-inline-end: 0; }
  table.t tr:nth-child(even) td { background: var(--stripe); }
  table.t tr:hover td { background: var(--p-soft); }
  .card.p-0 { padding: 0; }
  table.t tr.sel td { background: var(--p-soft) !important; }
  input[type=checkbox] { accent-color: var(--p); }
  table.t thead th { position: sticky; top: 0; z-index: 2; }
  .border, .border-b, .border-t, .divide-y > * { border-color: #e2e8f0; }
  .scroll-table { max-height: 70vh; overflow: auto; border-radius: .5rem; }
  .scroll-table table.t th { position: sticky; top: 0; z-index: 1; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; border-radius: 9999px; padding: .05rem .65rem; font-size: .78rem; font-weight: 500; }
  .dot { width: .6rem; height: .6rem; border-radius: 9999px; display: inline-block; }

  /* Theme panel */
  .swatch { width: 2.2rem; height: 2.2rem; border-radius: .5rem; border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; cursor: pointer; }
  .swatch:hover { transform: scale(1.08); }
  input[type=color] { width: 3rem; height: 2rem; border: 1px solid #cbd5e1; border-radius: .375rem; padding: 0; background: #fff; cursor: pointer; }
</style>

function t(key, params) {
  const get = (lang) => key.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), I18N[lang]);
  let s = get(S.lang); if (s === undefined) s = get('en'); if (s === undefined) s = key;
  if (params) Object.keys(params).forEach(k => { s = String(s).split('{' + k + '}').join(params[k]); });
  return s;
}
const L = (group, v) => v ? t('enum.' + group + '.' + v) : '';
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = n => Number(n || 0).toLocaleString('en-US');
/** Accounting format for money boxes: 3100000 -> 3,100,000 while typing. */
const moneyVal = el => String(el.value || '').replace(/[^\d.]/g, '');
function formatMoney(el) {
  const before = el.value.slice(0, el.selectionStart).replace(/[^\d]/g, '').length;
  const raw = moneyVal(el).split('.')[0];
  el.value = raw ? Number(raw).toLocaleString('en-US') : '';
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < before) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('money')) formatMoney(e.target); }, true);
const isTrue = v => v === true || v === 'TRUE' || v === 'true';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const dmy = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') : '';
const can = role => S.user && (S.user.role === 'admin' || S.user.role === role);
/** permission set by admin in Settings > Permissions */
const allow = k => S.user && (S.user.role === 'admin' || (S.perms || []).includes(k));
/** Area as Kanal + Marla, e.g. 646803 sqft -> "119 K 15.57 M" (no sq-ft fractions). */
const marlaOf = (sqft, marla) => Math.round(num(sqft) / (marla || 270) * 100) / 100;
function area(sqft, marla) {
  const tm = marlaOf(sqft, marla), k = Math.floor((tm + 1e-9) / 20), m = Math.round((tm - k * 20) * 100) / 100;
  return k ? `${fmt(k)} K ${m} M` : `${m} M`;
}
/** Bigger display: "119 K 15.57 M" + total marla underneath. */
function areaBig(sqft, marla) {
  if (!num(sqft)) return '<span class="text-slate-400">—</span>';
  return `${area(sqft, marla)}<div class="text-xs font-normal text-slate-500 num">${fmt(marlaOf(sqft, marla))} ${t('area.marla')}</div>`;
}
function statusChip(s) { const c = COLORS[s] || '#94a3b8'; return `<span class="chip" style="background:${c}1f;color:${c};border:1px solid ${c}55"><span class="dot" style="background:${c}"></span>${esc(L('plotStatus', s))}</span>`; }
function opts(group, selected, withEmpty) {
  return (withEmpty ? `<option value="">${esc(withEmpty)}</option>` : '') +

}

function toast(msg, bad) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="pointer-events-auto rounded shadow px-4 py-2 ${bad ? 'bg-red-600' : 'bg-p'} text-white">${esc(msg)}</div>`;

}

function call(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(res => {
      if (res && res.ok) return resolve(res.data);
      const code = (res && res.code) || 'err.server';
      if (code === 'err.session') { logoutLocal(); return reject(new Error(t(code))); }
      const params = Object.assign({}, res && res.params);
      if (params.status) params.status = L('caseStatus', params.status) !== 'enum.caseStatus.' + params.status ? L('caseStatus', params.status) : L('plotStatus', params.status);
      if (params.field) params.field = params.field;
      reject(new Error(t(code, params)));
    }).withFailureHandler(e => reject(new Error(t('err.server', { msg: e && e.message })))).api(S.token, action, payload || {});
  });
}

/** Read a form into an object. Names like enabled[code] become nested; hidden+checkbox pairs give last value. */
function formData(form) {
  const out = {};
  Array.from(form.elements).forEach(el => {
    if (!el.name || el.disabled) return;
    if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return;
    let v = el.type === 'checkbox' && el.value === 'on' ? true : el.value;
    if (el.classList.contains('money')) v = String(v).replace(/[^\d.]/g, '');
    const m = /^([^\[]+)\[([^\]]+)\]$/.exec(el.name);
    if (m) { out[m[1]] = out[m[1]] || {}; out[m[1]][m[2]] = v; } else out[el.name] = v;
  });
  Object.keys(out).forEach(k => { if (out[k] === '1') out[k] = out[k]; });
  return out;
}

function mix(hex, pct) { // lighten a colour toward white (pct 0..1)
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.round(c + (255 - c) * pct).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}

const ROUTES = [
  [/^#\/?$/, 'dashboard'], [/^#\/plots$/, 'plots'], [/^#\/plot\/(\d+)$/, 'plot'], [/^#\/registry$/, 'registry'], [/^#\/case\/(\d+)$/, 'case'],

  [/^#\/land$/, 'land'], [/^#\/settings$/, 'settings'],
];

function refreshGrid(pid) {
  call('plotGrid', { project_id: pid }).then(g => { g._pid = pid; S.grid = g; if (S.view === 'plots') gridRender(); }).catch(() => {});
}

async function load(keepScroll) {
  if (!S.token) return render();
  const app = document.getElementById('app');
  if (!keepScroll) app.innerHTML = `<p class="text-slate-500">${t('loading')}</p>`;
  let name = 'dashboard', arg = null;
  for (const [re, n] of ROUTES) { const m = re.exec(S.route); if (m) { name = n; arg = m[1]; break; } }
  const pid = S.projectId, f = S.filters || {};
  const loaders = {
    dashboard: () => call('dashboard', { project_id: pid }),
    plots: () => (S.grid && S.grid._pid === pid) ? (refreshGrid(pid), Promise.resolve(S.grid)) : call('plotGrid', { project_id: pid }).then(g => { g._pid = pid; return S.grid = g; }),
    plot: () => call('plot', { id: arg }),
    registry: () => call('registryList', { project_id: pid, status: (f.registry || {}).status }),
    case: () => call('registryCase', { id: arg }),
    approvals: () => call('approvals', { project_id: pid, status: (f.approvals || {}).status }),
    approval: () => call('approval', { id: arg }),
    customers: () => call('customers', { q: (f.customers || {}).q }),
    customer: () => call('customer', { id: arg }),
    land: () => call('land', { project_id: pid }),
    settings: () => Promise.all([call('rates'), call('getSettings'), call('users'), call('getPermissions')]),
  };
  try {
    S.view = name; S.data = await loaders[name]();
    if (name === 'approvals' && S.unread) { call('readNotifications').then(() => { S.unread = 0; }).catch(() => {}); }
  } catch (e) { S.data = null; toast(e.message, true); }
  render();
}

function render() {
  document.documentElement.dir = S.lang === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('top').innerHTML = header();
  const app = document.getElementById('app');
  if (!S.token) { app.innerHTML = viewLogin(); return; }
  if (!S.data) return;
  app.innerHTML = (VIEWS[S.view] || (() => ''))(S.data);
  afterRender();
}

// ===================================================================== actions
async function submitForm(ev, action, extra, opts) {
  ev.preventDefault();
  opts = opts || {};
  if (opts.confirm && !confirm(opts.confirm)) return false;
  const btn = ev.target.querySelector('button[type=submit],button:not([type])'); if (btn) btn.disabled = true;
  try {
    const res = await call(action, Object.assign(formData(ev.target), extra || {}));
    if (S.grid) S.grid._pid = null;
    toast(t('saved'));
    if (opts.goTo) return go(typeof opts.goTo === 'function' ? opts.goTo(res) : opts.goTo);
    await load(true);
  } catch (e) { toast(e.message, true); if (btn) btn.disabled = false; }
  return false;
}

async function doLogin(ev) {
  ev.preventDefault();
  const d = formData(ev.target);
  try {
    const r = await call('login', d);
    S.token = r.token; try { sessionStorage.setItem('lm_token', r.token); } catch (e) {}
    await boot();
  } catch (e) { toast(e.message, true); }
  return false;
}

function logoutLocal() { S.token = null; S.user = null; try { sessionStorage.removeItem('lm_token'); } catch (e) {} render(); }
function logout() { call('logout').catch(() => {}); logoutLocal(); }

async function boot() {
  try {
    const b = await call('bootstrap');
    S.user = b.user; S.projects = b.projects; S.enums = b.enums; S.unread = b.unread; S.perms = b.perms || [];
    if (b.theme) { try { S.defaultTheme = JSON.parse(b.theme); } catch (e) {} } loadTheme();
    if (!S.projectId || !S.projects.some(p => p.id === S.projectId)) S.projectId = (S.projects[0] || {}).id;
    if (b.user.locale && !localStorage.getItem('lm_lang')) S.lang = b.user.locale;
    load();
  } catch (e) { render(); }
}

const HAS_SOLD = ['sold', 'payment_cleared', 'registry_in_process', 'registered'];

function gf(k, v) { S.gf[k] = v; clearTimeout(gf._t); gf._t = setTimeout(gridRender, k === 'q' ? 150 : 0); }

function gridFiltered() {
  const f = S.gf || {}, q = (f.q || '').toLowerCase().trim();
  return (S.grid ? S.grid.rows : []).filter(r =>
    (!f.status || (f.status === 'pay_pending' ? r.pay_pending : r.sale_status === f.status)) &&
    (!f.street || (f.street === '-' ? !r.street_id : r.street_id === f.street)) &&
    (!f.facing || r.facing === f.facing) && (!f.size || r.size_marla === f.size) &&
    (!q || (r.plot_no + ' ' + r.customer + ' ' + r.cnic + ' ' + r.phone).toLowerCase().includes(q)));
}

function gridRender() {
  const body = document.getElementById('g-body');
  if (!body || !S.grid) return;
  const rows = gridFiltered();
  document.getElementById('g-count').textContent = `(${rows.length}${rows.length !== S.grid.rows.length ? ' / ' + S.grid.rows.length : ''})`;
  const box = (checked, enabled, onclick, title) =>
    `<input type="checkbox" class="w-5 h-5 cursor-pointer accent-[var(--p)]" ${checked ? 'checked' : ''} ${enabled ? '' : 'disabled'} title="${esc(title || '')}" onclick="event.preventDefault();${enabled ? onclick : ''}">`;
  body.innerHTML = rows.map(r => {
    const sold = HAS_SOLD.includes(r.sale_status), paid = HAS_PAID.includes(r.sale_status) && !r.pay_pending;
    const fard = r.case_id
      ? `<a class="chip cursor-pointer" style="background:#a855f71f;color:#7e22ce;border:1px solid #a855f755" onclick="go('#/case/${r.case_id}')">${esc(L('caseStatus', r.case_status))}</a>`
      : r.sale_status === 'registered' ? (r.pend_m > 0 ? box(false, allow('fard_demand'), `demandModal('${r.id}')`, t('g.fard')) : '') : box(false, allow('fard_demand') && ['payment_cleared', 'sold'].includes(r.sale_status), `demandModal('${r.id}')`, ['payment_cleared', 'sold'].includes(r.sale_status) ? t('g.fard') : t('g.need_sold'));
    return `<tr class="${G.sel.has(r.id) ? 'sel' : ''}">
      <td><input type="checkbox" ${G.sel.has(r.id) ? 'checked' : ''} onclick="gToggle('${r.id}', this.checked)"></td>
      <td><a class="link num font-medium" onclick="go('#/plot/${r.id}')">${esc(r.plot_no)}</a>${r.has_notes ? ' <span title="notes">📝</span>' : ''}
        ${r.sale_status === 'blocked' ? `<span class="chip ms-1" style="background:#6b72801f;color:#374151">${L('plotStatus', 'blocked')}</span>` : ''}</td>
      <td class="num">${r.size_marla ? esc(r.size_marla) + ' M' : '—'}</td>
      <td>${r.facing ? t('p.' + r.facing.toLowerCase()) : '—'}</td>
      <td>${r.customer ? `${esc(r.customer)}<div class="text-xs text-slate-400 num">${esc(r.phone)}</div>` : '<span class="text-slate-300">—</span>'}</td>
      <td class="text-center">${box(sold, r.sale_status !== 'blocked' && r.sale_status !== 'registry_in_process' && (sold ? (allow('cancel_sale') || allow('repurchase') || allow('transfer')) : allow('sell')), sold ? `soldMenu('${r.id}')` : `sellModal(['${r.id}'])`)}</td>
      <td class="text-center">${r.pay_pending ? pendChip(r.id) : box(paid, allow('payment_clear') && r.sale_status === 'sold', `payModal(['${r.id}'])`, sold ? '' : t('g.need_sold'))}</td>
      <td class="text-center">${fard}</td>
      <td class="text-center">${r.sale_status === 'registered' ? (r.pend_m > 0 ? `<span class="chip" style="background:#f59e0b22;color:#b45309;border:1px solid #f59e0b88" title="${t('r.partial_title')}">✔ ${r.reg_m} M · ${t('r.pending_m', { m: r.pend_m })}</span>` : '<span class="text-lg" style="color:#2563eb">✔</span>') : r.reg_m > 0 ? `<span class="text-xs text-slate-500">✔ ${r.reg_m} M</span>` : ''}</td>
      <td class="text-slate-500">${L('construction', r.construction_status)}</td></tr>`;
  }).join('') || `<tr><td colspan="10" class="text-slate-500 text-center py-6">${t('nothing')}</td></tr>`;
  const all = document.getElementById('g-all');
  if (all) all.checked = rows.length > 0 && rows.every(r => G.sel.has(r.id));
  bulkBar();
}

function gToggle(id, on) { on ? G.sel.add(id) : G.sel.delete(id); gridRender(); }
function gSelectAll(on) { gridFiltered().forEach(r => on ? G.sel.add(r.id) : G.sel.delete(r.id)); gridRender(); }

function bulkBar() {
  const el = document.getElementById('g-bulk'); if (!el) return;
  if (!G.sel.size || !(allow('sell') || allow('payment_clear'))) { el.innerHTML = ''; return; }
  const rows = S.grid.rows.filter(r => G.sel.has(r.id));
  const avail = rows.filter(r => r.sale_status === 'available').map(r => r.id), sold = rows.filter(r => r.sale_status === 'sold' || r.pay_pending).map(r => r.id);
  el.innerHTML = `<div class="card mb-3 flex flex-wrap items-center gap-3 text-sm" style="background:var(--p-soft)">
    <b>${t('g.selected', { n: G.sel.size })}</b>
    ${allow('sell') ? `<button class="btn bg-p" ${avail.length ? '' : 'disabled style="opacity:.4"'} onclick='sellModal(${JSON.stringify(avail)})'>${t('g.sell_selected', { n: avail.length })}</button>` : ''}
    ${allow('payment_clear') ? `<button class="btn bg-orange-600" ${sold.length ? '' : 'disabled style="opacity:.4"'} onclick='payModal(${JSON.stringify(sold)})'>${t('g.pay_selected', { n: sold.length })}</button>` : ''}
    <button class="inp" onclick="G.sel.clear();gridRender()">✕ ${t('g.clear_sel')}</button></div>`;
}

function modal(title, body) {
  document.getElementById('modal').innerHTML = `<div class="fixed inset-0 z-50 bg-black/40 flex items-start justify-center pt-10 overflow-auto" onclick="if(event.target===this)closeModal()">
    <div class="card w-full max-w-lg"><div class="flex justify-between items-center mb-3"><h2 class="font-semibold text-lg">${title}</h2>
      <button class="text-2xl leading-none" onclick="closeModal()">×</button></div>${body}</div></div>`;
}
function closeModal() { document.getElementById('modal').innerHTML = ''; }
const plotNos = ids => ids.map(id => (S.grid.rows.find(r => r.id === id) || {}).plot_no).join(', ');

async function gridAction(ev, op, ids, extra) {
  ev.preventDefault();
  const btn = ev.target.querySelector('button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  const data = Object.assign(formData(ev.target), extra || {}, { op, plot_ids: ids });
  if (op === 'sell' && !data.customer_id) {
    data.new_customer = { name: data.nc_name, father_name: data.nc_father, relation: data.nc_relation, cnic: data.nc_cnic, phone: data.nc_phone };
  }
  try {
    const r = await call('plotAction', data);
    r.rows.forEach(row => { const i = S.grid.rows.findIndex(x => x.id === row.id); if (i >= 0) S.grid.rows[i] = row; });
    if (r.customer_id && data.new_customer && !S.grid.customers.some(c => c.id === r.customer_id)) S.grid.customers.push({ id: r.customer_id, label: data.new_customer.name });
    ids.forEach(id => G.sel.delete(id));
    closeModal(); gridRender();
    if (r.errors.length) toast(r.errors.map(e => e.plot_no + ': ' + t(e.code, e.params)).join(' | '), true);
    else toast(t('g.done_n', { n: r.done.length }));
  } catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = t('save'); } }
  return false;
}

// ---- Excel (SheetJS is loaded only when needed)
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => bad(new Error('Excel library could not load')); document.head.appendChild(s); });
}
async function exportXlsx(kind) {
  try {
    toast(t('x.preparing'));
    const [X, d] = await Promise.all([loadXLSX(), call('exportData', { project_id: S.projectId, kind })]);
    const ws = X.utils.aoa_to_sheet([d.head, ...d.rows]);
    ws['!cols'] = d.head.map(h => ({ wch: Math.max(10, h.length + 2) }));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, d.name);
    X.writeFile(wb, `${(S.project && S.project.code) || 'RG2'}_${d.name}_${today()}.xlsx`);
  } catch (e) { toast(e.message, true); }
}
const OLD_COLS = [['plot_no', 'Plot No'], ['area_marla', 'Registry Area (Marla)'], ['buyer_name', 'Buyer Name'], ['relation', 'Relation (s/o d/o w/o)'], ['father_name', 'Father / Husband Name'],
  ['cnic', 'CNIC'], ['phone', 'Phone'], ['registry_no', 'Registry No'], ['registry_date', 'Registry Date (DD-MM-YYYY)'], ['registry_office', 'Registry Office'], ['maliyat', 'Maliyat'],
  ['mode', 'Registry By (Client / Company)'], ['fard_no', 'Fard No'], ['seller_intiqal_no', 'Seller Intiqal No'], ['buyer_intiqal_no', 'Buyer Intiqal No'], ['notes', 'Notes']];
async function downloadTemplate() {
  try {
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet([OLD_COLS.map(c => c[1]), ['25.02', '9', 'Sheikh Muhammad Tanveer', 's/o', 'Sadiq', '35202-1234567-1', '0300-1234567', '1234', '15-03-2025', 'Sub Registrar Sharaqpur', '3600000', 'Client', '567', '19692', '', 'example row – delete it']]);
    Object.keys(ws).forEach(k => { if (k[0] !== '!') ws[k].t = 's', ws[k].z = '@'; });
    ws['!cols'] = OLD_COLS.map(c => ({ wch: c[1].length + 2 }));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Old Registries'); X.writeFile(wb, 'Old_Registries_Template.xlsx');
  } catch (e) { toast(e.message, true); }
}
async function importOld(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const out = document.getElementById('import-result');
  try {
    const X = await loadXLSX(), wb = X.read(await file.arrayBuffer());
    const raw = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    const head = (raw[0] || []).map(h => String(h).trim().toLowerCase());
    const idx = OLD_COLS.map(([k, label]) => head.findIndex(h => h === label.toLowerCase() || h.startsWith(label.toLowerCase().split(' (')[0])));
    const rows = raw.slice(1).filter(r => r.some(v => String(v).trim())).map(r => Object.fromEntries(OLD_COLS.map(([k], i) => {
      let v = idx[i] >= 0 ? r[idx[i]] : '';
      if (k === 'registry_date' && typeof v === 'number') v = X.SSF.format('yyyy-mm-dd', v);   // Excel date serial
      return [k, String(v).trim()];
    })));
    if (!rows.length) return toast(t('nothing'), true);
    if (!confirm(t('x.confirm', { n: rows.length }))) return;
    out.innerHTML = `<p class="text-slate-500">${t('x.working')}</p>`;
    const res = await call('importRegistries', { project_id: S.projectId, rows });
    const good = res.filter(r => r.ok).length;
    out.innerHTML = `<p class="font-medium mb-2">${t('x.done', { ok: good, bad: res.length - good })}</p><table class="t"><tr><th>Row</th><th>${t('plot')}</th><th></th></tr>${res.map(r =>
      `<tr><td class="num">${r.row}</td><td class="num">${esc(r.plot)}</td><td class="${r.ok ? 'text-emerald-700' : 'text-red-700'}">${r.ok ? '✔ ' + esc(r.msg) : '✖ ' + esc(r.code ? t(r.code, r.params) : r.msg)}</td></tr>`).join('')}</table>`;
    if (S.grid) S.grid._pid = null;
  } catch (e) { out.innerHTML = ''; toast(e.message, true); }
}

function allocTotal(need) {
  const tot = [...document.querySelectorAll('input.alloc')].reduce((s, el) => s + num(el.value), 0);
  const el = document.getElementById('alloc-total'); if (!el) return;
  const ok = Math.abs(tot - need) < 0.5, ms = num(S.data.marla_sqft) || 270, mm = v => Math.round(v / ms * 100) / 100;
  el.innerHTML = `${t('r.alloc_total')}: <b>${fmt(Math.round(tot * 100) / 100)}</b> / ${fmt(need)} sq ft ${ok ? '✅' : tot > need ? '⚠' : ''}`
    + (tot > 0.5 && tot < need - 0.5 ? `<div class="text-amber-700">ℹ ${t('r.partial_note', { now: mm(tot), pending: mm(need - tot) })}</div>` : '');
  el.style.color = ok ? '#047857' : tot > need ? '#b91c1c' : '#b45309';
}
function allocAuto(need) {
  let left = num(need);
  document.querySelectorAll('input.alloc').forEach(el => {
    if (el.disabled) return;
    const take = Math.min(left, num(el.dataset.bal));
    el.value = take > 0 ? Math.round(take * 100) / 100 : ''; left -= take;
  });
  allocTotal(need);
}

  return `<table class="t"><tr><th>${t('r.item')}</th><th class="text-end">${t('r.rate')}</th><th class="text-end">${t('r.buyer_exp')}</th><th class="text-end">${t('r.seller_exp_col')}</th><th>${t('r.receipt')}</th></tr>
    ${e.lines.map(l => `<tr><td>${esc(l.label)} ${isTrue(l.is_manual) ? `<span class="text-xs text-amber-700">(${t('r.manual')})</span>` : ''}</td><td class="text-end num">${l.rate !== '' ? esc(l.rate) + '%' : ''}</td>
      <td class="text-end num">${l.payer === 'buyer' ? fmt(l.amount) : ''}</td><td class="text-end num">${l.payer === 'seller' ? fmt(l.amount) : ''}</td><td>${isTrue(l.receipt) ? t('r.receipt') : t('r.no_receipt')}</td></tr>`).join('')}
    <tr class="font-medium"><td>${t('r.total')}</td><td></td><td class="text-end num">${fmt(e.buyer_total)}</td><td class="text-end num">${fmt(e.seller_total)}</td><td></td></tr>
    <tr class="font-semibold"><td>${t('r.grand')}</td><td></td><td colspan="2" class="text-end num">Rs. ${fmt(e.grand_total)}</td><td></td></tr></table>
    <div class="text-xs text-slate-500 mt-1">${t('r.maliyat')}: <span class="num">${fmt(e.maliyat)}</span> · ${t('r.buyer')}: ${esc(e.buyer_name)} (${isTrue(e.buyer_is_filer) ? t('r.filer') : t('r.non_filer')}) · ${t('r.seller')}: ${esc(e.seller_name)} (${isTrue(e.seller_is_filer) ? t('r.filer') : t('r.non_filer')})</div>`;
}

VIEWS.case = d => {
  const c = d.case, st = c.status, isB = c.mode === 'company_managed', ms = d.marla_sqft;
  const steps = isB
    ? ['demand', 'fard_approval_pending', 'fard_approval_review', 'fard_approved', 'fard_jari_issued', 'fard_received', 'expense_approval_pending', 'expense_approval_review', 'expense_approved', 'expense_paid', 'registry_done', 'registry_recorded', 'handed_over']
    : ['demand', 'fard_approval_pending', 'fard_approval_review', 'fard_approved', 'fard_jari_issued', 'fard_received', 'fard_handed_over', 'client_registry_recorded'];
  const pos = steps.indexOf(st);
  let next = '';
  switch (st) {
    case 'demand': next = `<p class="mb-2">${t('r.send_fard_help')}</p>` + stepForm(c.id, 'send_fard_approval', '', t('r.send_fard')); break;
    case 'fard_approval_pending': case 'expense_approval_pending': next = `<p>${t('r.waiting')}</p>`; break;
    case 'fard_approval_review': case 'expense_approval_review':
      next = `<p class="mb-2">${t('r.replied')}</p>${d.approvals[0] ? `<button class="btn bg-amber-600" onclick="go('#/approval/${d.approvals[0].id}')">${t('a.open')}</button>` : ''}`; break;
    case 'fard_approved':
      next = allow('fard_jari') ? stepForm(c.id, 'fard_jari', `<p>${t('r.jari_help', { area: area(c.area_sqft, ms), sqft: c.area_sqft })}</p>
        <table class="t"><tr><th>${t('land.intiqal_no')}</th><th>${t('land.holder')}</th><th>${t('land.balance')}</th><th>${t('r.take')}</th>${allow('land') ? '<th></th>' : ''}</tr>
        ${d.intiqals.map(i => `<tr><td class="num">${esc(i.intiqal_no)}</td><td>${esc(i.holder_name)}</td><td class="num">${area(Math.max(0, i.balance), ms)}</td>
          <td><input type="number" step="0.01" min="0" max="${i.balance}" name="allocations[${i.id}]" data-bal="${Math.max(0, i.balance)}" class="inp w-32 num alloc" oninput="allocTotal(${c.area_sqft})" ${i.balance <= 0 ? 'disabled' : ''}>${num(i.area_sqft) <= 0 ? `<div class="text-xs text-amber-700">⚠ ${t('r.intiqal_no_area')}</div>` : ''}</td>${allow('land') ? `<td>${landEditBtn('intiqal', i.id)}</td>` : ''}</tr>`).join('')
          || `<tr><td colspan="5" class="text-amber-700 py-3">⚠ ${t('r.no_intiqal')}</td></tr>`}</table>
        <div class="flex flex-wrap items-center gap-3 text-sm">
          ${d.intiqals.some(i => i.balance > 0) ? `<button type="button" class="inp" onclick="allocAuto(${c.area_sqft})">⚡ ${t('r.auto_fill')}</button>` : ''}
          ${allow('land') ? `<button type="button" class="inp" onclick="addIntiqalModal()">+ ${t('r.add_intiqal_here')}</button>` : ''}
          <span id="alloc-total" class="num text-slate-500"></span></div>
        <textarea name="message" required rows="3" class="inp w-full">${esc(t('r.jari_default', { plot: d.plot.plot_no, area: area(c.area_sqft, ms), customer: d.customer_label }))}</textarea>`, t('r.issue_jari'))
        : `<p>${t('r.waiting_role', { role: L('roles', 'land_management') })}</p>`; break;
    case 'fard_jari_issued': next = stepForm(c.id, 'fard_received', `<input name="fard_no" placeholder="${t('r.fard_no')}" class="inp num"> ${dateInp()}`, t('r.fard_received')); break;
    case 'fard_received':
      next = isB ? expenseForm(d, 'registry_expense')
        : stepForm(c.id, 'hand_over_fard', dateInp(), t('r.hand_fard')) + `<details class="border rounded p-2 mt-4"><summary class="cursor-pointer">${t('r.seller_exp_opt')}</summary>${expenseForm(d, 'seller_expense')}</details>`; break;
    case 'fard_handed_over': next = `<p class="mb-2">${t('r.client_reg_help')}</p>` + stepForm(c.id, 'client_registry', registryFields(c), t('r.record_client'), 'bg-blue-700'); break;
    case 'expense_approved': next = `<p class="mb-2">${t('r.paid_help')}</p>` + stepForm(c.id, 'expense_paid', `<label class="flex gap-2"><input type="checkbox" required> ${t('r.expense_paid')}</label>`, t('save'), null, t('are_you_sure')); break;
    case 'expense_paid': next = stepForm(c.id, 'registry_done', registryFields(c), t('r.reg_done')); break;
    case 'registry_done': next = `<p class="mb-2">${t('r.record_help')}</p>` + stepForm(c.id, 'record_in_office', `${dateInp()} <input name="buyer_intiqal_no" placeholder="${t('r.buyer_intiqal')}" class="inp num"> <input name="registry_copy_url" placeholder="${t('r.copy_url')}" class="inp w-full num">`, t('r.record'), 'bg-blue-700'); break;
    case 'registry_recorded': next = stepForm(c.id, 'hand_over', dateInp(), t('r.hand_reg'), 'bg-blue-700'); break;
    default: next = `<p class="text-slate-500">${t('r.closed')}</p>`;
  }
  if (!['client_registry_recorded', 'handed_over', 'cancelled'].includes(st) && allow('cancel_case')) {
    next += `<details class="mt-6"><summary class="text-red-600 cursor-pointer">${t('r.cancel')}</summary>${stepForm(c.id, 'cancel', `<textarea name="reason" required class="inp w-full" placeholder="${t('reason')}"></textarea>`, t('r.cancel'), 'bg-red-600', t('are_you_sure'))}</details>`;
  }
  const line = (k, v) => v ? `<div>${k}: <span class="num">${v}</span></div>` : '';
  return `<div class="flex flex-wrap items-center gap-3 mb-4"><h1 class="text-xl font-semibold"><span class="num">${esc(c.reference)}</span> · ${t('plot')} <a class="link num" onclick="go('#/plot/${d.plot.id}')">${esc(d.plot.plot_no)}</a></h1>
    <span class="chip bg-purple-100 text-purple-800">${L('caseStatus', st)}</span><span class="chip bg-slate-200">${L('registryMode', c.mode)}</span></div>
  ${isTrue(c.payment_pending) ? `<div class="rounded border ${isTrue(d.plot.payment_pending) ? 'border-amber-400 bg-amber-50 text-amber-800' : 'border-emerald-300 bg-emerald-50 text-emerald-800'} p-3 mb-4 text-sm">
    ${isTrue(d.plot.payment_pending) ? '⚠ ' + t('g.pending_case', { amount: fmt(c.pending_amount) }) : '✔ ' + t('g.pending_cleared', { amount: fmt(c.pending_amount) })}${c.pending_remarks ? ` <span class="opacity-75">— ${esc(c.pending_remarks)}</span>` : ''}</div>` : ''}
  ${(() => { const a = d.plot_areas || {}, mm = v => Math.round(num(v) / (num(a.marla_sqft) || 270) * 100) / 100;
      return a.total && (a.registered > 0 || Math.abs(num(c.area_sqft) - a.total) > 0.5) ? `<div class="rounded border border-sky-300 bg-sky-50 text-sky-900 p-3 mb-4 text-sm">ℹ ${t('r.case_partial', { plot: mm(a.total), now: c.area_marla, done: mm(a.registered), pending: Math.max(0, Math.round((mm(a.total) - mm(a.registered) - num(c.area_marla) - mm(a.in_process)) * 100) / 100) })}</div>` : ''; })()}
  <ol class="flex flex-wrap gap-1 mb-6 text-xs">${steps.map((s, i) => `<li class="px-2 py-1 rounded ${pos >= 0 && i < pos ? 'bg-emerald-100 text-emerald-800' : i === pos ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-500'}">${L('caseStatus', s)}</li>`).join('')}</ol>
  <div class="grid md:grid-cols-3 gap-6">
    <section class="card text-sm space-y-1"><h2 class="font-semibold mb-2">${t('r.ref')}</h2>
      <div>${t('p.customer')}: ${esc(d.customer_label)} <span class="num text-slate-500">${esc(d.customer && d.customer.cnic)}</span></div>
      ${line(t('p.size'), esc(c.area_marla) + ' M (' + area(c.area_sqft, ms) + ')')}${line(t('r.maliyat'), 'Rs. ' + fmt(c.maliyat))}${line(t('r.demand_date'), dmy(c.demand_date))}
      ${c.seller_name ? `<div>${t('r.seller')}: ${esc(c.seller_name)}</div>` : ''}
      ${d.allocations.length ? `<div>${t('r.intiqals')}: <span class="num">${d.allocations.map(a => esc(a.intiqal_no) + ' (' + area(a.area_sqft, ms) + ')').join(', ')}</span></div>` : ''}
      ${c.fard_jari_message ? `<div class="bg-slate-50 rounded p-2 whitespace-pre-line">${esc(c.fard_jari_message)}</div>` : ''}
      ${line(t('r.fard_no'), esc(c.fard_no) + ' ' + dmy(c.fard_received_on))}${line(t('r.hand_fard'), dmy(c.fard_handed_over_on))}
      ${line(t('r.registry_no'), c.registry_no ? esc(c.registry_no) + ' · ' + dmy(c.registry_date) + ' ' + esc(c.registry_office) : '')}
      ${isTrue(c.expense_paid) ? `<div>${t('r.expense_paid')} ✔ <span class="num">${dmy(c.expense_paid_at)}</span></div>` : ''}
      ${line(t('r.record'), dmy(c.registry_recorded_on))}${line(t('r.hand_reg'), dmy(c.handed_over_on))}
      ${c.registry_copy_url ? `<div><a class="link" href="${esc(c.registry_copy_url)}" target="_blank">📎 ${t('r.copy_url')}</a></div>` : ''}
    </section>
    <section class="card text-sm md:col-span-2"><h2 class="font-semibold mb-3">${t('r.next')}</h2>${next}</section>
  </div>
  <section class="card mt-6"><h2 class="font-semibold mb-3">${t('nav.approvals')}</h2><table class="t">
    <tr><th>${t('r.ref')}</th><th>${t('a.type')}</th><th>${t('a.sent')}</th><th>${t('a.director')}</th><th>${t('a.verified')}</th><th>${t('p.status')}</th></tr>
    ${d.approvals.map(a => `<tr><td><a class="link num" onclick="go('#/approval/${a.id}')">${esc(a.reference)}</a></td><td>${L('approvalType', a.type)}</td><td class="num">${esc(a.sent_at).slice(0, 16)}</td>
      <td>${a.decision ? t('a.' + a.decision) : '—'} <span class="num text-slate-500">${esc(a.decided_at).slice(0, 16)}</span></td><td>${esc(a.verifier)}</td><td>${L('approvalStatus', a.status)}</td></tr>`).join('') || `<tr><td colspan="6" class="text-slate-500">${t('nothing')}</td></tr>`}</table></section>
  ${d.expenses.map(e => `<section class="card mt-6"><h2 class="font-semibold mb-2">${e.kind === 'seller_expense' ? t('r.seller_exp') : t('r.reg_exp')} · <span class="num">${esc(e.created_at).slice(0, 16)}</span></h2>${expenseTable(e)}</section>`).join('')}`;
};

VIEWS.approvals = d => {
  const f = (S.filters || {}).approvals || {};
  return `<h1 class="text-xl font-semibold mb-4">${t('nav.approvals')}</h1>
  <select class="inp mb-3 text-sm" onchange="S.filters={approvals:{status:this.value}};load()"><option value="">${t('all')}</option>
    ${Object.keys(t('enum.approvalStatus')).map(s => `<option value="${s}" ${s === f.status ? 'selected' : ''}>${L('approvalStatus', s)}</option>`).join('')}</select>
  <div class="card p-0 scroll-table"><table class="t"><tr><th>${t('r.ref')}</th><th>${t('plot')}</th><th>${t('a.type')}</th><th>${t('a.sent')}</th><th>${t('p.status')}</th><th>${t('a.verified')}</th></tr>
    ${d.map(a => `<tr class="hover:bg-slate-50"><td><a class="link num" onclick="go('#/approval/${a.id}')">${esc(a.reference)}</a></td><td class="num">${esc(a.plot_no)}</td><td>${L('approvalType', a.type)}</td>
      <td class="num">${esc(a.sent_at).slice(0, 16)}</td><td>${L('approvalStatus', a.status)}</td><td>${esc(a.verifier)}</td></tr>`).join('') || `<tr><td colspan="6" class="text-slate-500">${t('nothing')}</td></tr>`}</table></div>`;
};

VIEWS.approval = d => {
  const a = d.approval;
  let actions = '';
  if (['director_approved', 'director_rejected'].includes(a.status) && allow('verify_approval')) {
    actions += `<form class="border-t pt-3 space-y-2" onsubmit="return submitForm(event,'verifyApproval',{id:'${a.id}'})">
      <p>${a.status === 'director_approved' ? t('a.help_ok') : t('a.help_no')}</p><textarea name="remarks" class="inp w-full" placeholder="${t('notes')}"></textarea>
      <label class="flex gap-2"><input type="checkbox" required> ${t('a.checked')}</label><button class="btn bg-p">${t('a.verify')}</button></form>`;
  }
  if (['needs_review', 'sent'].includes(a.status) && allow('verify_approval')) {
    actions += `<details class="border-t pt-3" ${a.status === 'needs_review' ? 'open' : ''}><summary class="cursor-pointer">${t('a.resolve')}</summary>
      <form class="space-y-2 mt-2" onsubmit="return submitForm(event,'resolveApproval',{id:'${a.id}'})"><p class="text-slate-500">${t('a.resolve_help')}</p>
      <select name="decision" class="inp"><option value="approved">${t('a.approved')}</option><option value="rejected">${t('a.rejected')}</option></select>
      <textarea name="remarks" required class="inp w-full" placeholder="${t('a.how_confirmed')}"></textarea><button class="btn bg-amber-600">${t('save')}</button></form></details>`;
  }
  return `<div class="flex flex-wrap items-center gap-3 mb-4"><h1 class="text-xl font-semibold"><span class="num">${esc(a.reference)}</span> · ${L('approvalType', a.type)}</h1>
    <span class="chip bg-amber-100 text-amber-800">${L('approvalStatus', a.status)}</span>
    <a class="link text-sm" onclick="go('#/case/${d.case.id}')">${esc(d.case.reference)} · ${t('plot')} <span class="num">${esc(d.plot_no)}</span></a></div>
  <div class="grid md:grid-cols-2 gap-6">
    <section class="card text-sm space-y-1"><h2 class="font-semibold mb-2">${t('a.sent')}</h2>
      <div>${t('a.to')}: <span class="num">${esc(a.to_email)}</span></div>${a.cc ? `<div>CC: <span class="num">${esc(a.cc)}</span></div>` : ''}
      <div>${t('a.subject')}: <span class="num">${esc(a.subject)}</span></div><div><span class="num">${esc(a.sent_at)}</span> · ${esc(d.sender)}</div></section>
    <section class="card text-sm space-y-2"><h2 class="font-semibold mb-2">${t('a.decision')}</h2>
      ${a.decision ? `<div class="text-lg font-semibold ${a.decision === 'approved' ? 'text-p' : 'text-red-700'}">${t('a.' + a.decision)}</div>
        <div>${t('a.how')}: ${t('a.' + a.decision_channel)} · <span class="num">${esc(a.decided_from_email)} · ${esc(a.decided_at)}</span></div>
        ${a.director_remarks ? `<div class="bg-slate-50 rounded p-2">“${esc(a.director_remarks)}”</div>` : ''}` : `<p class="text-slate-500">${t('a.none')}</p>`}
      ${d.inbound.length ? `<div class="font-medium pt-2">${t('a.inbound')}</div>` + d.inbound.map(m => `<div class="border rounded p-2 text-xs"><div class="num">${esc(m.from_email)} · ${esc(m.received_at)} · <b>${L('result', m.result)}</b></div>
        <div class="text-slate-600 whitespace-pre-line mt-1">${esc(String(m.body_text).slice(0, 400))}</div></div>`).join('') : ''}
      ${actions}
      ${a.verified_at ? `<div class="border-t pt-2">${t('a.verified')}: ${esc(d.verifier)} · <span class="num">${esc(a.verified_at)}</span>${a.verify_remarks ? `<div class="text-slate-500">${esc(a.verify_remarks)}</div>` : ''}</div>` : ''}
    </section></div>
  ${d.expense ? `<section class="card mt-6">${expenseTable(d.expense)}</section>` : ''}`;
};

VIEWS.customers = d => {
  const f = (S.filters || {}).customers || {};
  return `<h1 class="text-xl font-semibold mb-4">${t('nav.customers')}</h1>
  <form class="flex gap-2 mb-3 text-sm" onsubmit="event.preventDefault();S.filters={customers:formData(this)};load()"><input name="q" value="${esc(f.q || '')}" placeholder="${t('c.search')}" class="inp"><button class="btn bg-slate-800">${t('filter')}</button></form>
  <div class="card p-0 scroll-table mb-6"><table class="t"><tr><th>${t('c.name')}</th><th>${t('c.cnic')}</th><th>${t('c.phone')}</th><th>${t('c.plots')}</th><th>${t('c.filer')}</th></tr>
    ${d.map(c => `<tr class="hover:bg-slate-50"><td><a class="link" onclick="go('#/customer/${c.id}')">${esc(c.label)}</a></td><td class="num">${esc(c.cnic)}</td><td class="num">${esc(c.phone)}</td><td class="num">${c.plots}</td><td>${isTrue(c.is_filer) ? '✔' : ''}</td></tr>`).join('') || `<tr><td colspan="5" class="text-slate-500">${t('nothing')}</td></tr>`}</table></div>
  ${allow('customers') ? `<section class="card"><h2 class="font-semibold mb-3">${t('c.new')}</h2>
    <form class="grid md:grid-cols-3 gap-3 text-sm" onsubmit="return submitForm(event,'saveCustomer',{})">
      <input name="name" required placeholder="${t('c.name')}" class="inp"><input name="name_ur" dir="rtl" placeholder="${t('c.name_ur')}" class="inp">
      <div class="flex gap-1"><select name="relation" class="inp"><option>s/o</option><option>d/o</option><option>w/o</option></select><input name="father_name" placeholder="${t('c.father')}" class="inp flex-1"></div>
      <input name="cnic" placeholder="00000-0000000-0" pattern="\\d{5}-\\d{7}-\\d" class="inp num"><input name="phone" placeholder="${t('c.phone')}" class="inp num"><input name="email" type="email" placeholder="${t('email')}" class="inp num">
      <input name="address" placeholder="${t('c.address')}" class="inp md:col-span-2"><label class="flex gap-2 items-center"><input type="checkbox" name="is_filer" value="TRUE"> ${t('c.filer')}</label>
      <input name="nominee_name" placeholder="${t('c.nominee')}" class="inp"><input name="nominee_cnic" placeholder="${t('c.nominee_cnic')}" class="inp num"><input name="nominee_relation" placeholder="${t('c.nominee_rel')}" class="inp">
      <div><button class="btn bg-p">${t('save')}</button></div></form></section>` : ''}`;

VIEWS.customer = d => `<h1 class="text-xl font-semibold mb-1">${esc(d.label)}</h1>
  <p class="text-sm text-slate-500 mb-4"><span class="num">${esc(d.customer.cnic)} · ${esc(d.customer.phone)}</span> · ${esc(d.customer.address)}</p>
  <div class="grid md:grid-cols-2 gap-6">
    <section class="card text-sm"><h2 class="font-semibold mb-2">${t('c.current')}</h2>${d.current.map(p => `<a class="flex justify-between border-b py-1 cursor-pointer" onclick="go('#/plot/${p.id}')"><span class="num">${esc(p.plot_no)}</span>${statusChip(p.sale_status)}</a>`).join('') || t('nothing')}</section>
    <section class="card text-sm"><h2 class="font-semibold mb-2">${t('c.history')}</h2>${d.history.map(o => `<div class="flex justify-between border-b py-1"><a class="link num" onclick="go('#/plot/${o.plot_id}')">${esc(o.plot_no)}</a>
      <span class="num">${dmy(o.started_on)} → ${o.ended_on ? dmy(o.ended_on) : t('now')}</span><span>${L('event', o.end_event)}</span></div>`).join('') || t('nothing')}</section></div>`;

function areaInputs() {
  return `<div class="flex gap-1"><input type="number" step="0.01" min="0" name="kanal" placeholder="${t('area.kanal')}" class="inp w-20 num"><input type="number" step="0.01" min="0" name="marla" placeholder="${t('area.marla')}" class="inp w-20 num"><input type="number" step="0.01" min="0" name="sqft" placeholder="${t('area.sqft')}" class="inp w-24 num"></div>`;
}

const LAND_KIND = { purchase: ['purchases', 'savePurchase', 'land.edit_purchase'], intiqal: ['intiqals', 'saveIntiqal', 'land.edit_intiqal'], parcel: ['parcels', 'saveParcel', 'land.edit_parcel'] };
function landFields(kind, d) {
  if (kind === 'purchase') return `<input name="seller_name" required placeholder="${t('land.seller')}" class="inp"><input name="seller_father_name" placeholder="${t('c.father')}" class="inp"><input name="seller_cnic" placeholder="00000-0000000-0" class="inp num"><input name="seller_phone" placeholder="${t('c.phone')}" class="inp num">

function landEditBtn(kind, id) {
  return allow('land') ? `<button class="link text-sm whitespace-nowrap" onclick="landEdit('${kind}','${id}')">✏ ${t('edit')}</button>` : '';
}
function landEdit(kind, id) {
  const d = S.data, [list, action, title] = LAND_KIND[kind];
  const rec = (d[list] || []).find(x => String(x.id) === String(id)); if (!rec) return;
  modal(t(title), `<form id="landEditForm" class="grid grid-cols-2 gap-2 text-sm" onsubmit="closeModalAfter(event,'${action}',{id:'${rec.id}',project_id:'${S.projectId}'})">${landFields(kind, d)}
    <div class="col-span-2 flex justify-between gap-2 mt-2"><button type="button" class="btn bg-red-600 text-white" onclick="landDelete('${kind}','${rec.id}')">🗑 ${t('delete')}</button><button type="submit" class="btn bg-p">${t('save')}</button></div></form>`);
  const f = document.getElementById('landEditForm');
  f.kanal.parentElement.classList.add('col-span-2');
  Object.keys(rec).forEach(k => {
    const els = f.querySelectorAll(`[name="${k}"]`);
    els.forEach(el => {
      if (el.type === 'hidden') return;
      if (el.type === 'checkbox') el.checked = isTrue(rec[k]);
      else if (el.type === 'date') el.value = String(rec[k] || '').slice(0, 10);
      else el.value = rec[k] == null ? '' : rec[k];
    });
  });
  // area: split sq ft into kanal / marla / sqft
  const ms = Number(d.marla_sqft) || 270, tot = Number(rec.area_sqft) || 0;
  const mTot = Math.floor(tot / ms + 1e-9), kanal = Math.floor(mTot / 20), marla = mTot % 20, sq = Math.round((tot - mTot * ms) * 100) / 100;
  f.kanal.value = kanal || ''; f.marla.value = marla || ''; f.sqft.value = sq || '';
}
async function closeModalAfter(ev, action, extra) {
  ev.preventDefault();
  const btn = ev.target.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try { await call(action, Object.assign(formData(ev.target), extra || {})); closeModal(); toast(t('saved')); await load(true); }
  catch (e) { toast(e.message, true); if (btn) btn.disabled = false; }
  return false;
}
async function landDelete(kind, id) {
  if (!confirm(t('land.confirm_delete'))) return;
  try { await call('deleteLand', { kind, id }); closeModal(); toast(t('deleted')); await load(true); }
  catch (e) { toast(e.message, true); }
}

/** Settings > Registry rates: compact table (Item | Rate | Buyer | Seller), view / edit mode. */
function initRates(rates) {
  S.rateDraft = rates.map(r => Object.assign({}, r, { params: r.params ? JSON.parse(r.params) : {} }));
  S.rateEdit = false; S.showZero = false; S.rateCalc = {};
  renderRates(); calcRates();
}
const rateFiler = r => r.payer === 'buyer' ? document.getElementById('calc-bf').checked : document.getElementById('calc-sf').checked;
function rateText(r) {
  const pct = v => (v === '' || v === undefined ? '0' : String(num(v))) + '%';
  switch (r.calc_type) {
    case 'percent': return pct(r.rate) + (num(r.fixed_amount) ? ' + ' + fmt(r.fixed_amount) : '');
    case 'percent_filer': return pct(rateFiler(r) ? r.rate : r.non_filer_rate) + ` <span class="text-xs text-slate-400">${rateFiler(r) ? t('r.filer') : t('r.non_filer')}</span>`;
    case 'fixed': return 'Rs ' + fmt(r.fixed_amount);
    case 'excise': return 'Rs ' + fmt(r.fixed_amount);
    case 'percent_land': return pct(r.rate) + ` <span class="text-xs text-slate-400">${t('r.land_value')}</span>`;
    default: return '';
  }
}
function rateInputs(r) {
  const inp = (f, v, w) => f === 'fixed_amount'
    ? `<input value="${fmt(v)}" ${'type="text" inputmode="numeric"'} class="inp ${w || 'w-20'} num py-0.5 money" oninput="rd('${r.id}','${f}',moneyVal(this))">`
    : `<input value="${esc(v)}" class="inp ${w || 'w-20'} num py-0.5" oninput="rd('${r.id}','${f}',this.value)">`;
  switch (r.calc_type) {
    case 'percent': return inp('rate', r.rate) + '% + Rs ' + inp('fixed_amount', r.fixed_amount, 'w-24');
    case 'percent_filer': { const f = rateFiler(r) ? 'rate' : 'non_filer_rate'; return inp(f, r[f]) + `% <span class="text-xs text-slate-400">${rateFiler(r) ? t('r.filer') : t('r.non_filer')}</span>`; }
    case 'fixed': case 'excise': return 'Rs ' + inp('fixed_amount', r.fixed_amount, 'w-24');
    case 'percent_land': return inp('rate', r.rate) + '%';
    default: return '';
  }
}
function rulesBox(r) {
  const keys = Object.keys(r.params || {});
  if (!keys.length) return '';
  return `<details class="inline-block ms-1"><summary class="cursor-pointer select-none list-none inline">⚙</summary>
    <div class="mt-1 p-2 border rounded bg-white text-xs space-y-1">${keys.map(k => `<label class="flex items-center justify-between gap-2">${t('s.param_' + k)}

}
function rd(id, f, v) { const r = S.rateDraft.find(x => x.id === id); r[f] = v; calcRates(); }
function rdp(id, k, v) { const r = S.rateDraft.find(x => x.id === id); r.params[k] = num(v); calcRates(); }

function renderRates() {
  const box = document.getElementById('rates-table'); if (!box || !S.rateDraft) return;
  const rows = S.rateDraft.filter(r => isTrue(r.is_active)).sort((a, b) => num(a.sort) - num(b.sort));
  box.innerHTML = `<div class="overflow-x-auto"><table class="t">

    <tbody>${rows.map(r => `<tr data-code="${r.code}">
      <td>${esc(S.lang === 'ur' && r.label_ur ? r.label_ur : r.label)}${rulesBox(r)}</td>

      <td class="text-end num font-medium" data-amt-s="${r.code}">${r.payer === 'seller' ? '—' : ''}</td></tr>`).join('')}
      <tr class="font-semibold"><td>${t('r.total')}</td><td></td><td class="text-end num" id="calc-b">—</td><td class="text-end num" id="calc-s">—</td></tr></tbody></table></div>
    <div class="flex justify-between items-center mt-2 text-sm"><a class="link" id="zero-link" onclick="S.showZero=!S.showZero;calcRates()"></a></div>`;
  document.getElementById('rates-btns').innerHTML = S.rateEdit
    ? `<button class="btn bg-p" onclick="saveRates()">${t('save')}</button> <button class="inp" onclick="initRates(S.data[0])">${t('s.cancel_edit')}</button>`
    : `<button class="inp" onclick="S.rateEdit=true;renderRates();calcRates()">✏ ${t('s.edit_rates')}</button>`;
  applyRateCalc();
}

function applyRateCalc() {
  const c = S.rateCalc || {}; let hidden = 0;
  document.querySelectorAll('#rates-table tr[data-code]').forEach(tr => {
    const code = tr.dataset.code, amt = c.lines ? c.lines[code] : undefined;
    const b = tr.querySelector('[data-amt-b]'), s2 = tr.querySelector('[data-amt-s]');
    if (b.textContent !== '') b.textContent = amt === undefined ? '—' : fmt(amt);
    if (s2.textContent !== '') s2.textContent = amt === undefined ? '—' : fmt(amt);
    const hide = c.lines && !S.showZero && !S.rateEdit && !amt;
    tr.style.display = hide ? 'none' : ''; if (hide) hidden++;
  });
  const v = id => document.getElementById(id);
  if (c.lines) { v('calc-b').textContent = fmt(c.buyer); v('calc-s').textContent = fmt(c.seller); v('calc-g').textContent = 'Rs. ' + fmt(c.grand); }
  const zl = v('zero-link');
  if (zl) zl.textContent = S.rateEdit ? '' : S.showZero ? t('s.hide_zero') : hidden ? t('s.show_all', { n: hidden }) : '';
}

function calcRates() {
  clearTimeout(calcRates._t);
  calcRates._t = setTimeout(async () => {
    const v = id => document.getElementById(id);
    if (!v('calc-maliyat') || !S.rateDraft) return;
    try {
      const r = await call('expensePreview', { kind: 'registry_expense', maliyat: moneyVal(v('calc-maliyat')), area_marla: v('calc-area').value,
        buyer_is_filer: v('calc-bf').checked, seller_is_filer: v('calc-sf').checked, land_value: moneyVal(v('calc-land')), rates: rateEdits() });
      const lines = {}; r.lines.forEach(l => lines[l.code] = l.amount);
      S.rateCalc = { lines, buyer: r.buyer_total, seller: r.seller_total, grand: r.grand_total };
      applyRateCalc();
    } catch (e) {}
  }, 300);
}
function rateEdits() {
  return (S.rateDraft || []).map(r => ({ id: r.id, rate: r.rate, non_filer_rate: r.non_filer_rate, fixed_amount: r.fixed_amount, params: Object.keys(r.params || {}).length ? r.params : undefined }));
}
async function saveRates() {
  try { await call('saveRates', { rates: rateEdits() }); toast(t('saved')); S.data[0] = await call('rates'); initRates(S.data[0]); }
  catch (e) { toast(e.message, true); }
}

async function savePerms(ev) {
  ev.preventDefault();
  const map = {};
  (S.data[3].defs || []).forEach(d => map[d.key] = []);
  ev.target.querySelectorAll('[data-perm]').forEach(i => { if (i.checked) map[i.dataset.perm].push(i.dataset.role); });
  try { await call('savePermissions', { map }); toast(t('saved')); const b = await call('bootstrap'); S.perms = b.perms || []; } catch (e) { toast(e.message, true); }
  return false;
}

function afterRender() {
  if (S.view === 'plots') gridRender();
  if (S.view === 'settings') initRates(S.data[0]);
  document.querySelectorAll('form[id^="exp-"]').forEach(form => {
    const kind = form.id.replace('exp-', '');
    let timer;
    const refresh = async () => {
      try {
        const r = await call('expensePreview', Object.assign(formData(form), { kind }));
        form.querySelectorAll('[data-amount]').forEach(td => td.textContent = '—');
        r.lines.forEach(l => { const td = form.querySelector(`[data-amount="${l.code}"]`); if (td) td.textContent = fmt(l.amount); });
        form.querySelector('[data-total="bs"]').textContent = fmt(r.buyer_total) + ' / ' + fmt(r.seller_total);
        form.querySelector('[data-total="grand"]').textContent = 'Rs. ' + fmt(r.grand_total);
      } catch (e) {}
    };
    form.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(refresh, 400); });
    form.addEventListener('change', refresh);
    refresh();
  });
}

// ===================================================================== start
try {
  google.script.history.setChangeHandler(e => { S.route = e.location.hash ? '#' + e.location.hash.replace(/^#/, '') : '#/'; load(); });
  google.script.url.getLocation(loc => { if (loc.hash) S.route = '#' + loc.hash.replace(/^#/, ''); start(); });
} catch (e) { start(); }
function start() { loadTheme(); document.documentElement.dir = S.lang === 'ur' ? 'rtl' : 'ltr'; if (S.token) boot(); else render(); }
</script>
</body>
</html>
